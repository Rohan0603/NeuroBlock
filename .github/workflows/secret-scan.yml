name: Secret Scan

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$base/$archive" --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" --output "$RUNNER_TEMP/checksums.txt"
          expected="$(awk -v name="$archive" '$2 == name { print $1; exit }' "$RUNNER_TEMP/checksums.txt")"
          test -n "$expected"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP/gitleaks"
          test -x "$RUNNER_TEMP/gitleaks/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Verify real CLI synthetic-secret detection
        run: python3 scripts/test_gitleaks_cli.py
      - name: Scan pull-request history
        if: github.event_name == 'pull_request'
        run: gitleaks git --redact --no-banner --exit-code 1 --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}" .
      - name: Scan pushed or manually dispatched history
        if: github.event_name != 'pull_request'
        run: gitleaks git --redact --no-banner --exit-code 1 .
